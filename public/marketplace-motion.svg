<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 390" role="img" aria-label="Kitap ve kulaklık ilanları arasında öğrenci alışverişi">
<defs><linearGradient id="paper" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8e5f8"/></linearGradient><linearGradient id="book" x2="1" y2="1"><stop stop-color="#ffbe91"/><stop offset="1" stop-color="#ec866e"/></linearGradient><linearGradient id="screen" x2="1" y2="1"><stop stop-color="#8c7cce"/><stop offset="1" stop-color="#534b91"/></linearGradient></defs>
<style>.books{animation:books 5s ease-in-out infinite;transform-origin:194px 191px}.music{animation:music 5s ease-in-out infinite;transform-origin:405px 206px}.chat{animation:chat 4s ease-in-out infinite}.check{animation:check 3s ease-in-out infinite;transform-origin:414px 322px}.route{stroke-dasharray:5 12;animation:route 3s linear infinite}.spark{animation:spark 4s ease-in-out infinite}@keyframes books{0%,100%{transform:translateY(5px) rotate(-5deg)}50%{transform:translateY(-7px) rotate(-2deg)}}@keyframes music{0%,100%{transform:translateY(-5px) rotate(6deg)}50%{transform:translateY(7px) rotate(3deg)}}@keyframes chat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes check{0%,75%,100%{transform:scale(1)}85%{transform:scale(1.1)}}@keyframes route{to{stroke-dashoffset:-51}}@keyframes spark{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.books,.music,.chat,.check,.route,.spark{animation:none}}</style>
<ellipse cx="307" cy="202" rx="224" ry="161" fill="#aaa0e4" opacity=".15"/><circle cx="454" cy="91" r="48" fill="#ffd5b3"/><circle cx="106" cy="291" r="51" fill="#bfe4d7" opacity=".8"/><path class="route" d="M86 205C49 54 426 5 503 177S317 407 179 307" fill="none" stroke="#c6bceb" stroke-width="3"/>
