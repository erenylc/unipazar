<g class="music"><rect x="309" y="127" width="192" height="225" rx="24" fill="#171833" opacity=".2"/><rect x="309" y="117" width="192" height="225" rx="24" fill="url(#paper)"/><rect x="321" y="129" width="168" height="141" rx="16" fill="#cce5de"/><ellipse cx="406" cy="244" rx="54" ry="9" fill="#749c92" opacity=".2"/><path d="M369 218v-32a37 37 0 0 1 74 0v32" fill="none" stroke="#4a456d" stroke-width="12" stroke-linecap="round"/><path d="M372 181a34 34 0 0 1 68 0" fill="none" stroke="#b2a5d9" stroke-width="5"/><rect x="360" y="193" width="24" height="44" rx="11" fill="url(#screen)"/><rect x="431" y="193" width="24" height="44" rx="11" fill="url(#screen)"/><path d="M367 201v27m71-27v27" stroke="#b7a8e0" stroke-width="4" stroke-linecap="round"/><rect x="326" y="285" width="102" height="8" rx="4" fill="#655a8d"/><rect x="326" y="301" width="64" height="6" rx="3" fill="#b1abc4"/></g>
