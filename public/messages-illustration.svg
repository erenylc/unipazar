<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" fill="none">
 <style>.chat-one{animation:chat-float 3.8s ease-in-out infinite}.chat-two{animation:chat-float 3.8s -1.9s ease-in-out infinite}.typing{animation:typing 1.2s ease-in-out infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}.chat-spark{animation:spark 2.5s ease-in-out infinite;transform-origin:248px 42px}@keyframes chat-float{0%,100%{transform:translateY(10px) rotate(-2deg)}50%{transform:translateY(-12px) rotate(3deg)}}@keyframes typing{50%{transform:translateY(-7px);opacity:.45}}@keyframes spark{50%{transform:scale(1.2) rotate(12deg)}}@media(prefers-reduced-motion:reduce){.chat-one,.chat-two,.typing,.chat-spark{animation:none}}</style>
