 <g class="chat-two"><path d="M137 95h113a17 17 0 0 1 17 17v37a17 17 0 0 1-17 17h-13v16l-24-16h-76a17 17 0 0 1-17-17v-37a17 17 0 0 1 17-17Z" fill="#8a78bb"/><circle class="typing" cx="163" cy="131" r="6" fill="#fff3e6"/><circle class="typing d2" cx="194" cy="131" r="6" fill="#fff3e6"/><circle class="typing d3" cx="225" cy="131" r="6" fill="#fff3e6"/></g>
 <g class="chat-spark"><circle cx="248" cy="42" r="22" fill="#fff5e8"/><path d="M248 53c-12-8-16-13-12-18 4-5 10-2 12 2 2-4 8-7 12-2 4 5 0 10-12 18Z" fill="#e07c93"/></g>
