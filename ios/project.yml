name: UniSatis
options:
  bundleIdPrefix: com.unisatis
  deploymentTarget:
    iOS: '16.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  UniSatis:
    type: application
    platform: iOS
    sources:
      - path: UniSatis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unisatis.app
        INFOPLIST_FILE: UniSatis/Info.plist
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: '16.4'
